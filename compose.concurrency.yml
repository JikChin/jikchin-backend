name: jikchin-concurrency

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mate_lock_test
      MYSQL_USER: mate_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-root-test-only
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    command:
      - --innodb-lock-wait-timeout=10
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
