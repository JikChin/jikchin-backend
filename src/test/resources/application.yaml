spring:
  datasource:
    # review_stats upsert가 MySQL의 INSERT ... ON DUPLICATE KEY UPDATE를 쓰므로 H2를 MySQL 모드로 띄운다.
    url: jdbc:h2:mem:jikchin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

security:
  jwt:
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    issuer: jikchin-backend
    access-token-expiration: 15m
    refresh-token-expiration: 14d
