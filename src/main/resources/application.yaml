spring:
  application:
    name: backend
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:jikchin}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
#    properties:
#      hibernate:
#        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:jikchin-backend}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

#logging:
#  level:
#    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE
#

# Install docs/sql/event-activity/V001__create_event_activity_logs.sql before enabling.
activity-log:
  enabled: ${ACTIVITY_LOG_ENABLED:false}
  partition:
    cron: ${ACTIVITY_LOG_PARTITION_CRON:-}
    delete-enabled: ${ACTIVITY_LOG_DELETE_ENABLED:false}
