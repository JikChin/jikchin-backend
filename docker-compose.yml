services:
  mysql:
    image: mysql:8.4
    container_name: jikchin-mysql
    environment:
      MYSQL_DATABASE: jikchin
      MYSQL_USER: jikchin
      MYSQL_PASSWORD: jikchin
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
